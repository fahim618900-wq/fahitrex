<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, "Noto Sans Bengali", sans-serif;
            overflow: hidden;

            /* Default: PC Light */
            background-image: url("path/logol.p.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            transition: background-image 0.3s ease;
        }

        /* ================================
           MOBILE
           ================================ */

        @media (max-width: 767px) {

            body {
                /* Mobile Light */
                background-image: url("path/logol.m.png");
            }

        }

        /* ================================
           DARK MODE
           ================================ */

        @media (prefers-color-scheme: dark) {

            body {
                /* PC Dark */
                background-image: url("path/logod.p.png");
            }

            @media (max-width: 767px) {

                body {
                    /* Mobile Dark */
                    background-image: url("path/logod.m.png");
                }

            }
        }

        /* ================================
           CONTENT
           ================================ */

        .content {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            z-index: 2;
        }

    </style>
</head>

<body>

    <main class="content">
        <!-- আপনার ওয়েবসাইটের মূল কনটেন্ট এখানে থাকবে -->
    </main>

</body>
</html>
