<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ফিক্সড ব্যাকগ্রাউন্ড অ্যাপ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* মূল স্ক্রিনের স্ক্রল বন্ধ থাকবে */
    }

    /* মোবাইলে ছবি স্থির রাখার ১০০০% কার্যকরী CSS (Address bar glitch proof) */
    .mobile-fixed-bg {
      position: fixed;
      inset: 0; /* top:0, right:0, bottom:0, left:0 এর বিকল্প */
      width: 100vw;
      height: 100vh;
      background-image: url('YOUR_IMAGE_URL.jpg'); /* আপনার ছবির সঠিক লিংক দিন */
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 1;
      
      /* হার্ডওয়্যার অ্যাক্সিলারেশন (ছবি যেন কোনোভাবেই না কাঁপে বা নড়ে) */
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
      will-change: transform;
    }

    /* নেভিগেশন বার */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid #ffffff;
      border-radius: 4px;
      font-size: 14px;
      font-family: sans-serif;
    }

    /* আইফ্রেম কন্টেন্ট হোল্ডার */
    .content-frame {
      position: fixed;
      top: 60px; /* নেভবারের নিচে শুরু হবে */
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      border: none;
      z-index: 2; /* ছবির উপরে থাকবে */
      background: transparent;
    }
  </style>
</head>
<body>

  <!-- ১. সম্পূর্ণ স্থির ব্যাকগ্রাউন্ড -->
  <div class="mobile-fixed-bg"></div>

  <!-- ২. নেভিগেশন মেনু (অন্যান্য পেজে যাওয়ার লিংক) -->
  <nav>
    <a href="home.html" target="page-viewer">হোম</a>
    <a href="about.html" target="page-viewer">আমাদের সম্পর্কে</a>
    <a href="contact.html" target="page-viewer">যোগাযোগ</a>
  </nav>

  <!-- ৩. এখানে অন্য পেজগুলো লোড হবে, ব্যাকগ্রাউন্ড ছবি একটুকুও সরবে না -->
  <iframe src="home.html" name="page-viewer" class="content-frame"></iframe>

</body>
</html>
